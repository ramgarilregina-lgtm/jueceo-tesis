    { video: ['videos/M7_I_PNFUSBP.mp4'], hablante: 'M7', condicion: 'ironico', item_id: 'PNFUSBP' },
    { video: ['videos/H7_I_LSJUSBP.mp4'], hablante: 'H7', condicion: 'ironico', item_id: 'LSJUSBP' },
    { video: ['videos/H8_I_PNFUSBP.mp4'], hablante: 'H8', condicion: 'ironico', item_id: 'PNFUSBP' },
    { video: ['videos/M8_I_LCDEPESBH.mp4'], hablante: 'M8', condicion: 'ironico', item_id: 'LCDEPESBH' },
    { video: ['videos/H9_I_ECDLCDMXESL.mp4'], hablante: 'H9', condicion: 'ironico', item_id: 'ECDLCDMXESL' },
    { video: ['videos/H10_I_LCDEPESBH.mp4'], hablante: 'H10', condicion: 'ironico', item_id: 'LCDEPESBH' },
    { video: ['videos/H11_I_LSJUSBP.mp4'], hablante: 'H11', condicion: 'ironico', item_id: 'LSJUSBP' },
    { video: ['videos/H1_N_PNFUBP.mp4'], hablante: 'H1', condicion: 'neutro', item_id: 'PNFUBP' },
  ];

  // 3. Selección aleatoria de 1 lista por cada juez
  const todasLasListas = [lista1, lista2, lista3, lista4];
const listaAsignada = jsPsych.randomization.sampleWithoutReplacement(todasLasListas, 1)[0];

  const videosAPrecargar = listaAsignada.map(item => item.video[0]);

  jsPsych.data.addProperties({
    lista_asignada: todasLasListas.indexOf(listaAsignada) + 1
  });

  // 4. Construcción de la Línea de Tiempo (Timeline)
  const timeline = [];

  const instrucciones = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="instrucciones">
        <h2>Bienvenido(a) al experimento de percepción lingüística</h2>
        <p>A continuación verás una serie de videos breves. Cada video se reproducirá en un bucle continuo (loop).</p>
        <p>Tu tarea es evaluar la intención del hablante utilizando la escala del 1 al 5:</p>
        <ul>
          <li><strong>1:</strong> No irónica / Totalmente literal o seria</li>
          <li><strong>2:</strong> Ligeramente literal</li>
          <li><strong>3:</strong> Neutral / Ambigua</li>
          <li><strong>4:</strong> Moderadamente irónica / sarcástica</li>
          <li><strong>5:</strong> Totalmente irónica / sarcástica</li>
        </ul>
        <p>Por favor, asegúrate de tener el audio de tu dispositivo activado.</p>
      </div>
    `,
    choices: ['Comenzar experimento']
  };
  timeline.push(instrucciones);

  const precarga = {
    type: jsPsychPreload,
    video: videosAPrecargar,
    message: 'Cargando los videos del experimento... Por favor espera un momento.',
    error_message: 'Ocurrió un error al cargar los estímulos multimedia.'
  };
  timeline.push(precarga);

  const ensayoVideo = {
    type: jsPsychVideoButtonResponse,
    stimulus: jsPsych.timelineVariable('video'),
    choices: ['1', '2', '3', '4', '5'],
    prompt: `
      <p style="font-size: 18px; margin-top: 15px; font-weight: bold;">
        ¿Qué tan irónica o sarcástica es la intención del hablante?
      </p>
      <p style="font-size: 13px; color: #666;">
        (1 = No irónica / Literal | 5 = Totalmente irónica / Sarcástica)
      </p>
    `,
    autoplay: true,
    controls: false,           
    response_ends_trial: true, 
    trial_ends_after_video: false,
    on_load: function() {
      const reproductor = document.querySelector('video');
      if (reproductor) {
        reproductor.loop = true;
      }
    },
    data: {
      hablante: jsPsych.timelineVariable('hablante'),
      condicion: jsPsych.timelineVariable('condicion'),
      item_id: jsPsych.timelineVariable('item_id')
    }
  };

  const bloqueExperimental = {
    timeline: [ensayoVideo],
    timeline_variables: listaAsignada,
    randomize_order: true 
  };
  timeline.push(bloqueExperimental);

  // PANTALLA SECRETA: Envío de datos a OSF 
  const guardar_datos = {
    type: jsPsychPipe,
    action: "save",
    experiment_id: "Lf2zVvNOTphY", // SUSTITUYE POR TU CÓDIGO DE 12 CARACTERES DE DATAPIPE
    filename: `${sujeto_id}.csv`,
    data_string: () => jsPsych.data.get().csv()
  };
  timeline.push(guardar_datos);

  const cierre = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <h2>¡Muchas gracias por tu participación!</h2>
      <p>Tus respuestas han sido enviadas y registradas de forma segura.</p>
    `,
    choices: ['Cerrar']
  };
  timeline.push(cierre);

  jsPsych.run(timeline);
</script>
